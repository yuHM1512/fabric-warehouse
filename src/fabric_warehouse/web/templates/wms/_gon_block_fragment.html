<div class="flex items-start justify-between gap-4 border-b border-black/5 pb-5">
  <div>
    <div class="text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant">Kho mở rộng</div>
    <div class="mt-2 text-2xl font-extrabold font-headline text-on-surface">Block {{ block }}</div>
  </div>
  <button
    type="button"
    class="rounded-full bg-surface-container-lowest px-5 py-3 text-sm font-bold text-primary hover:bg-white transition-colors"
    onclick="(function(){ const m=document.getElementById('palletModal'); if(m) m.classList.add('hidden'); const c=document.getElementById('palletModalContent'); if(c) c.innerHTML=''; })()"
  >
    Đóng
  </button>
</div>

<div class="mt-6 overflow-x-auto">
  <table class="min-w-full text-sm">
    <thead class="bg-surface-container-low text-on-surface-variant">
        <tr class="text-left">
        <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-widest">Loại gòn</th>
        <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-widest">Số kiện</th>
        <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-widest">Số YDS</th>
        <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-widest">Vị trí</th>
      </tr>
    </thead>
    <tbody class="bg-surface-container-lowest">
      {% for row in rows %}
        <tr class="hover:bg-surface-container-low transition-colors">
          <td class="px-6 py-4 font-semibold">{{ row.gon_type }}</td>
          <td class="px-6 py-4 tabular-nums">{{ row.so_kien }}</td>
          <td class="px-6 py-4 tabular-nums">{{ "%.2f"|format(row.so_yds) }}</td>
          <td class="px-6 py-4 font-extrabold font-headline text-primary">{{ row.vi_tri }}</td>
        </tr>
      {% else %}
        <tr><td class="px-6 py-8 text-on-surface-variant" colspan="4">Block này chưa có gòn.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
